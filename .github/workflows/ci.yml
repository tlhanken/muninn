name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # `nix flake check` builds packages.default, which runs the Tier 1 parser
      # contract inside the derivation (pytestCheckHook) and asserts the package
      # imports. It also needs hermes-agent's flake input, because the interpreter
      # comes from hermes.passthru.python rather than a hardcoded python312.
      - name: nix flake check
        run: nix flake check --print-build-logs
